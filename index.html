<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Задание 18 — вариант 1 | Тренажёр от Макса</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #17212b;
      --muted: #667085;
      --accent: #3b82f6;
      --accent2: #2563eb;
      --ok: #16a34a;
      --bad: #dc2626;
      --warn: #d97706;
      --border: #e4e7ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #ede9fe, transparent 35%),
        var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 60px;
    }

    header {
      background: linear-gradient(135deg, #6d28d9, #db2777);
      color: #fff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(109, 40, 217, 0.25);
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(22px, 4vw, 32px);
    }

    .subtitle {
      margin: 0;
      opacity: 0.94;
      line-height: 1.5;
      font-size: 15px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 20px 0;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      transition: 0.2s;
      box-shadow: 0 8px 18px rgba(59, 130, 246, 0.25);
    }

    .btn:hover {
      background: var(--accent2);
      transform: translateY(-1px);
    }

    .btn.ghost {
      background: #fff;
      color: var(--text);
      border: 1px solid #d0d5dd;
      box-shadow: none;
    }

    .btn.ghost:hover { background: #f9fafb; }

    .total {
      margin-left: auto;
      font-weight: 700;
      color: #344054;
      background: #fff;
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .card {
      background: var(--card);
      border-radius: 22px;
      padding: 22px;
      margin: 18px 0;
      box-shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
      border: 1px solid #eef2f6;
    }

    .task-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 19px;
    }

    .status {
      font-size: 13px;
      font-weight: 800;
      padding: 5px 10px;
      border-radius: 999px;
      background: #f2f4f7;
      color: #667085;
    }

    .status.ok { background: #dcfce7; color: #166534; }
    .status.bad { background: #fee2e2; color: #991b1b; }

    .sentence {
      padding: 16px 18px;
      background: #faf5ff;
      border-radius: 14px;
      margin: 12px 0;
      font-size: 16px;
      border: 1px solid #f3e8ff;
      line-height: 1.75;
    }

    .sentence .m {
      display: inline-block;
      font-weight: 800;
      color: #7c3aed;
      padding: 0 3px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .input-row label {
      font-weight: 600;
      color: #475467;
    }

    .answer-input {
      flex: 1;
      min-width: 180px;
      padding: 11px 14px;
      font-size: 17px;
      font-weight: 700;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      font-family: inherit;
      letter-spacing: 2px;
      background: #fff;
      color: #111827;
      transition: 0.15s;
    }

    .answer-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .answer-input.correct {
      border-color: #86efac;
      background: #f0fdf4;
      color: #166534;
    }

    .answer-input.wrong {
      border-color: #fca5a5;
      background: #fef2f2;
      color: #991b1b;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .feedback {
      margin-top: 12px;
      font-weight: 600;
      line-height: 1.5;
      font-size: 15px;
    }

    .explain {
      margin-top: 8px;
      padding: 10px 14px;
      background: #f8fafc;
      border-left: 4px solid #a78bfa;
      border-radius: 10px;
      color: #475467;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .card { padding: 16px; }
      .toolbar .total {
        width: 100%;
        margin-left: 0;
        text-align: center;
      }
      .actions { flex-direction: column; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Задание 18 • Вариант 1</h1>
      <p class="subtitle">
        Расставьте все недостающие знаки препинания: укажите все цифры, на месте которых
        в предложении должны стоять запятые. Впишите номера <b>без пробелов и запятых</b>
        в порядке возрастания, например: <b>1234</b>.
      </p>
    </header>

    <div class="toolbar">
      <button class="btn" id="checkAll">Проверить всё</button>
      <button class="btn ghost" id="resetAll">Сбросить всё</button>
      <div class="total" id="total">Выполнено: 0 из 10 • Верно: 0</div>
    </div>

    <main id="tasks"></main>
  </div>

  <script>
    const tasksData = [
      {
        id: 1,
        correct: "1234",
        parts: [
          "В Академии художеств В.И. Суриков учился ", ["(1)"],
          " по его словам ", ["(2)"],
          " «со страшной жадностью к занятиям» и при таком усердии ", ["(3)"],
          " разумеется ", ["(4)"],
          " окончил её с золотой медалью."
        ],
        explanation: "1 и 2 — обособление вводного сочетания «по его словам»; 3 и 4 — обособление вводного слова «разумеется»."
      },
      {
        id: 2,
        correct: "1234",
        parts: [
          "Деятельность Саввы Ивановича Мамонтова ", ["(1)"],
          " конечно ", ["(2)"],
          " занимает достойное место в истории русской культуры: он был одним из крупнейших меценатов России, создателем Абрамцевского художественного кружка. В этом ", ["(3)"],
          " по мнению историков ", ["(4)"],
          " заключалась высокая патриотическая миссия Мамонтова."
        ],
        explanation: "1 и 2 — обособление вводного слова «конечно»; 3 и 4 — обособление вводного сочетания «по мнению историков»."
      },
      {
        id: 3,
        correct: "1234",
        parts: [
          "В лесу ", ["(1)"],
          " к радости ", ["(2)"],
          " мы сорвали несколько гроздей схваченной морозом рябины. Это была ", ["(3)"],
          " пожалуй ", ["(4)"],
          " последняя память о лете, об осени."
        ],
        explanation: "1 и 2 — обособление вводного слова «к радости»; 3 и 4 — обособление вводного слова «пожалуй»."
      },
      {
        id: 4,
        correct: "12",
        parts: [
          "Хотя дождь льёт как из ведра, мы ", ["(1)"],
          " однако ", ["(2)"],
          " вынуждены продолжать свой путь. Сквозь мглу ", ["(3)"],
          " видно ", ["(4)"],
          " кое-что, но трудно разобрать цвет и очертания предметов."
        ],
        explanation: "1 и 2 — обособление вводного слова «однако» в середине предложения. Цифры 3 и 4 не нужны: здесь «видно» — сказуемое, а не вводное слово."
      },
      {
        id: 5,
        correct: "12",
        parts: [
          "Мир таинственный ", ["(1)"],
          " мир мой древний ", ["(2)"],
          ",<br>Ты, как ветер, затих и присел.<br>Вот сдавили за шею деревню<br>Каменные руки шоссе."
        ],
        explanation: "1 и 2 — запятые при обращении «Мир таинственный, мир мой древний» (с. А. Есенин)."
      },
      {
        id: 6,
        correct: "1234",
        parts: [
          "Если мы осознаём, что лучше наших родных мест нет ", ["(1)"],
          " пожалуй ", ["(2)"],
          " ничего на свете, то этим в значительной степени мы обязаны ", ["(3)"],
          " конечно ", ["(4)"],
          " художникам и поэтам, которые помогают нам понять красоту природы, воспитывают в нас любовь к ней."
        ],
        explanation: "1 и 2 — обособление вводного слова «пожалуй»; 3 и 4 — обособление вводного слова «конечно»."
      },
      {
        id: 7,
        correct: "23",
        parts: [
          "Тебе одной ", ["(1)"],
          " плету венок,<br>Цветами сыплю стёжку серую.<br>О Русь ", ["(2)"],
          " покойный уголок ", ["(3)"],
          "<br>Тебя люблю, тебе и верую."
        ],
        explanation: "2 и 3 — запятые при обращении «О Русь, покойный уголок» (с. А. Есенин). Цифра 1 не нужна: «Тебе одной» — дополнение, не обращение."
      },
      {
        id: 8,
        correct: "1234",
        parts: [
          "О, как на склоне наших лет<br>Нежней мы любим и суеверней...<br>Сияй, сияй ", ["(1)"],
          " прощальный свет<br>Любви последней, зари вечерней!<br>Полнеба обхватила тень,<br>Лишь там, на западе, бродит сиянье, –<br>Помедли, помедли ", ["(2)"],
          " вечерний день ", ["(3)"],
          ",<br>Продлись, продлись ", ["(4)"],
          " очарованье."
        ],
        explanation: "1 — обращение «прощальный свет любви последней, зари вечерней»; 2 и 3 — обращение «вечерний день»; 4 — обращение «очарованье» (Ф.И. Тютчев)."
      },
      {
        id: 9,
        correct: "34",
        parts: [
          "В жаркий летний день листья на деревьях ", ["(1)"],
          " будто ", ["(2)"],
          " сквозят изумрудами. Каждый листочек ", ["(3)"],
          " кажется ", ["(4)"],
          " состоит из множества прожилок."
        ],
        explanation: "3 и 4 — обособление вводного слова «кажется». Цифры 1 и 2 не нужны: «будто» здесь — сравнительный союз, а не вводное слово."
      },
      {
        id: 10,
        correct: "34",
        parts: [
          "Князь Василий говорил ", ["(1)"],
          " всегда ", ["(2)"],
          " лениво, как актёр говорит роль старой пьесы. Анна Павловна Шерер ", ["(3)"],
          " наоборот ", ["(4)"],
          " была преисполнена оживления и порывов."
        ],
        explanation: "3 и 4 — обособление вводного слова «наоборот». Цифры 1 и 2 не нужны: «всегда» — обстоятельство времени, а не вводное слово."
      }
    ];

    const container = document.getElementById("tasks");

    tasksData.forEach((task) => {
      const card = document.createElement("section");
      card.className = "card";
      card.dataset.task = task.id;

      const sentenceHTML = task.parts.map((part) => {
        if (Array.isArray(part)) {
          return `<span class="m">${part[0]}</span>`;
        }
        return part;
      }).join("");

      card.innerHTML = `
        <div class="task-head">
          <h2>Предложение ${task.id}</h2>
          <span class="status"></span>
        </div>
        <div class="sentence">${sentenceHTML}</div>
        <div class="input-row">
          <label for="ans-${task.id}">Ваш ответ:</label>
          <input
            id="ans-${task.id}"
            class="answer-input"
            type="text"
            inputmode="numeric"
            placeholder="например, 1234"
            autocomplete="off"
          >
        </div>
        <div class="actions">
          <button class="btn check">Проверить</button>
          <button class="btn ghost reset">Сбросить</button>
        </div>
        <div class="feedback"></div>
      `;

      container.appendChild(card);

      const input = card.querySelector(".answer-input");

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          checkTask(card, task);
        }
      });

      input.addEventListener("input", () => {
        input.value = input.value.replace(/[^0-9]/g, "");
      });

      card.querySelector(".check").addEventListener("click", () => {
        checkTask(card, task);
      });

      card.querySelector(".reset").addEventListener("click", () => {
        resetTask(card, task);
      });
    });

    function normalize(str) {
      return (str || "").replace(/\s+/g, "").replace(/,/g, "");
    }

    function sortDigits(str) {
      return str.split("").sort().join("");
    }

    function checkTask(card, task) {
      const input = card.querySelector(".answer-input");
      const raw = normalize(input.value);
      const given = sortDigits(raw);
      const correct = sortDigits(task.correct);
      const isEmpty = raw.length === 0;
      const isCorrect = !isEmpty && given === correct;

      input.classList.remove("correct", "wrong");

      const status = card.querySelector(".status");
      const feedback = card.querySelector(".feedback");

      if (isEmpty) {
        status.textContent = "";
        status.className = "status";
        feedback.innerHTML = `<span style="color:var(--warn)">⚠️ Введите ответ, чтобы проверить.</span>`;
        updateTotal();
        return;
      }

      if (isCorrect) {
        input.classList.add("correct");
        status.textContent = "Верно";
        status.className = "status ok";
        feedback.innerHTML = `
          ✅ Верно! Правильный ответ: <b>${task.correct}</b>.
          <div class="explain">${task.explanation}</div>
        `;
      } else {
        input.classList.add("wrong");
        status.textContent = "Ошибка";
        status.className = "status bad";
        feedback.innerHTML = `
          ❌ Пока неверно. Вы ввели: <b>${raw || "—"}</b>.
          Правильный ответ: <b>${task.correct}</b>.
          <div class="explain">${task.explanation}</div>
        `;
      }

      updateTotal();
    }

    function resetTask(card) {
      const input = card.querySelector(".answer-input");
      input.value = "";
      input.classList.remove("correct", "wrong");

      const status = card.querySelector(".status");
      status.textContent = "";
      status.className = "status";

      card.querySelector(".feedback").textContent = "";

      updateTotal();
    }

    function updateTotal() {
      const cards = [...document.querySelectorAll(".card")];
      let done = 0;
      let ok = 0;

      cards.forEach((card) => {
        const status = card.querySelector(".status");
        if (status.textContent) {
          done++;
          if (status.classList.contains("ok")) {
            ok++;
          }
        }
      });

      document.getElementById("total").textContent =
        `Выполнено: ${done} из ${cards.length} • Верно: ${ok}`;
    }

    document.getElementById("checkAll").addEventListener("click", () => {
      tasksData.forEach((task) => {
        const card = document.querySelector(`.card[data-task="${task.id}"]`);
        const input = card.querySelector(".answer-input");
        if (normalize(input.value).length > 0) {
          checkTask(card, task);
        }
      });
    });

    document.getElementById("resetAll").addEventListener("click", () => {
      tasksData.forEach((task) => {
        const card = document.querySelector(`.card[data-task="${task.id}"]`);
        resetTask(card, task);
      });
    });
  </script>
</body>
</html>
